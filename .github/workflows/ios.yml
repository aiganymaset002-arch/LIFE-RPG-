name: iOS app (Xcode build)

on:
  push:
    branches: [main]
    paths: ["LifeRPG/**", "LifeRPG.xcodeproj/**", "Tests/**", "PrivacyInfo.xcprivacy", ".github/workflows/ios.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Core checks (game logic)
        run: |
          swiftc LifeRPG/Core/RPGModels.swift LifeRPG/Core/RPGEngine.swift LifeRPG/Core/GameMaster.swift \
            LifeRPG/Core/RPGSeed.swift Tests/CoreCheck/main.swift -o "$RUNNER_TEMP/corecheck" 2>&1 | tee core.log
          "$RUNNER_TEMP/corecheck"

      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project LifeRPG.xcodeproj -scheme LifeRPG -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Report compile errors
        if: failure()
        run: |
          for f in core.log build.log; do
            [ -f "$f" ] || continue
            grep -E "^/.*:[0-9]+:[0-9]+: error:" "$f" | sort -u | head -40 | while IFS= read -r l; do
              file=$(echo "$l" | cut -d: -f1 | sed "s#$GITHUB_WORKSPACE/##"); line=$(echo "$l" | cut -d: -f2); msg=$(echo "$l" | cut -d: -f5-)
              echo "::error file=$file,line=$line::$msg"
            done
          done
          { echo '### Ошибки сборки'; echo '```'; grep -hE "error:" core.log build.log 2>/dev/null | sort -u | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LifeRPG-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/LifeRPG.app
