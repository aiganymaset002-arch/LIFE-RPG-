<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2532" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0f3f"/>
      <stop offset="0.28" stop-color="#3b1d6e"/>
      <stop offset="0.5" stop-color="#7a3d8f"/>
      <stop offset="0.66" stop-color="#d4708a"/>
      <stop offset="0.78" stop-color="#f3a771"/>
      <stop offset="1" stop-color="#f7c98a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.7" r="0.45">
      <stop offset="0" stop-color="#fff2c4" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffd39a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3f7e"/><stop offset="1" stop-color="#2a1a45"/>
    </linearGradient>
    <linearGradient id="rockFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a9c"/><stop offset="1" stop-color="#5a3a78"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd38a"/><stop offset="1" stop-color="#3f9a6a"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c47aa0"/><stop offset="1" stop-color="#e8a08a" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="portal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.35" stop-color="#6fe0ff"/>
      <stop offset="0.7" stop-color="#3a7bff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3a7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#sky)"/>
  <rect width="390" height="844" fill="url(#sun)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="30" cy="40" r="1.1" opacity=".9"/><circle cx="90" cy="95" r=".8" opacity=".7"/><circle cx="150" cy="30" r="1.3"/>
    <circle cx="210" cy="120" r=".9" opacity=".8"/><circle cx="260" cy="60" r="1.2"/><circle cx="330" cy="25" r=".9"/>
    <circle cx="365" cy="110" r="1.1" opacity=".8"/><circle cx="55" cy="170" r=".8" opacity=".6"/><circle cx="300" cy="170" r=".8" opacity=".6"/>
    <circle cx="120" cy="210" r=".7" opacity=".5"/><circle cx="185" cy="75" r=".6" opacity=".7"/><circle cx="240" cy="230" r=".7" opacity=".5"/>
  </g>
  <g fill="#ffe9a8">
    <path d="M300 80 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".9"/>
    <path d="M70 120 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5z" opacity=".8"/>
  </g>
  <!-- far mountains -->
  <path d="M0 560 L40 520 L75 545 L120 490 L165 540 L200 505 L245 548 L290 498 L330 535 L390 500 L390 640 L0 640Z" fill="url(#mtn)" opacity=".55"/>
  <!-- clouds -->
  <g fill="#ffd2b8" opacity=".55" filter="url(#blur1)">
    <ellipse cx="80" cy="600" rx="90" ry="16"/><ellipse cx="140" cy="590" rx="60" ry="14"/>
    <ellipse cx="320" cy="612" rx="100" ry="18"/><ellipse cx="250" cy="600" rx="50" ry="12"/>
  </g>
  <g fill="#f6b8c8" opacity=".35" filter="url(#blur4)">
    <ellipse cx="200" cy="420" rx="160" ry="22"/><ellipse cx="60" cy="300" rx="90" ry="14"/><ellipse cx="340" cy="330" rx="80" ry="12"/>
  </g>
  <!-- far floating island with castle -->
  <g opacity=".8">
    <path d="M245 300 Q290 290 335 300 Q325 330 300 350 Q290 368 284 352 Q270 335 255 322Z" fill="url(#rockFar)"/>
    <path d="M245 300 Q290 290 335 300 Q290 296 245 300Z" fill="#9fd9a8"/>
    <g fill="#6a4a8e">
      <rect x="270" y="262" width="10" height="38"/><rect x="300" y="268" width="9" height="32"/>
      <rect x="282" y="250" width="16" height="50"/>
      <polygon points="268,262 275,248 282,262"/><polygon points="298,268 304.5,255 311,268"/><polygon points="280,250 290,230 300,250"/>
    </g>
    <g fill="#ffd77a"><rect x="288" y="262" width="3" height="5"/><rect x="273" y="272" width="2.5" height="4"/><rect x="303" y="278" width="2.5" height="4"/></g>
  </g>
  <!-- magic portal swirl top right -->
  <g opacity=".85">
    <circle cx="372" cy="150" r="70" fill="url(#portal)" filter="url(#blur4)"/>
    <path d="M330 130 Q372 90 410 140 Q380 120 350 150 Q370 175 400 165" fill="none" stroke="#c9f6ff" stroke-width="3" opacity=".8"/>
    <path d="M320 170 Q360 200 405 180" fill="none" stroke="#8fe9ff" stroke-width="2" opacity=".7"/>
  </g>
  <!-- left big floating island -->
  <g>
    <path d="M-20 250 Q50 236 130 252 Q120 300 92 336 Q78 380 60 410 Q50 378 40 350 Q10 320 -20 300Z" fill="url(#rock)"/>
    <path d="M-20 250 Q50 236 130 252 Q118 262 100 260 Q60 254 -20 262Z" fill="url(#grass)"/>
    <path d="M10 262 Q30 280 20 300 M70 262 Q80 290 68 320 M100 262 Q105 280 96 300" stroke="#3a2558" stroke-width="2" fill="none" opacity=".6"/>
    <!-- tree -->
    <rect x="28" y="205" width="6" height="40" fill="#5b3a2a"/>
    <circle cx="31" cy="198" r="22" fill="#ff9fc2"/><circle cx="18" cy="208" r="14" fill="#ffb7d1"/><circle cx="45" cy="207" r="15" fill="#f58fb6"/>
  </g>
  <!-- right lower island (stage for mascot) -->
  <g transform="translate(0,-118)">
    <path d="M150 640 Q270 618 410 636 L410 700 Q360 720 330 760 Q300 800 270 780 Q230 740 190 712 Q160 690 150 640Z" fill="url(#rock)"/>
    <path d="M150 640 Q270 618 410 636 L410 652 Q280 640 156 656Z" fill="url(#grass)"/>
    <ellipse cx="290" cy="642" rx="80" ry="8" fill="#2a1a45" opacity=".35"/>
    <g fill="#ffb7d1"><circle cx="190" cy="642" r="5"/><circle cx="200" cy="638" r="4"/><circle cx="380" cy="640" r="5"/></g>
  </g>
  <!-- bottom vignette -->
  <rect y="650" width="390" height="194" fill="#1b0e33" opacity=".0"/>
  <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0e33" stop-opacity="0"/><stop offset="1" stop-color="#140a28" stop-opacity=".9"/></linearGradient>
  <rect y="520" width="390" height="324" fill="url(#vig)"/>
  <!-- sparkles -->
  <g fill="#fff6c8">
    <circle cx="160" cy="470" r="1.6"/><circle cx="230" cy="520" r="1.2"/><circle cx="110" cy="560" r="1.4"/><circle cx="340" cy="470" r="1.5"/>
  </g>
</svg>
